<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>disponible</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 0.75rem;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 0.75rem;
        }

        /* ── Login ── */
        .login-box {
            max-width: 420px;
            margin: 4rem auto;
            text-align: center;
        }
        .login-box h1 { margin-bottom: 0.5rem; }
        .login-box .subtitle { color: #666; margin-bottom: 2rem; font-size: 0.95rem; }
        .login-form { display: flex; flex-direction: column; gap: 1rem; }
        .login-input {
            width: 100%; padding: 0.9rem 1rem;
            border: 2px solid #e0e0e0; border-radius: 8px;
            font-size: 1rem; transition: border-color 0.3s;
        }
        .login-input:focus { outline: none; border-color: #667eea; }
        .login-btn {
            padding: 0.9rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 8px;
            font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
        }
        .login-btn:hover { opacity: 0.9; }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .login-message { padding: 0.8rem 1rem; border-radius: 8px; font-size: 0.9rem; display: none; }
        .login-message.success { background: #d4edda; color: #155724; border-left: 4px solid #28a745; display: block; }
        .login-message.error { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; display: block; }

        /* ── Bibliothèque ── */
        h1 { color: #333; margin-bottom: 0.5rem; text-align: center; }

        .top-bar { display: flex; justify-content: flex-end; margin-bottom: 1rem; }
        .logout-btn {
            background: none; border: 1px solid #ccc;
            padding: 0.4rem 0.9rem; border-radius: 6px;
            font-size: 0.85rem; color: #666; cursor: pointer; transition: all 0.2s;
        }
        .logout-btn:hover { border-color: #dc3545; color: #dc3545; }

        .book-list { list-style: none; }

        /* ── Ligne compacte ── */
        .book-item {
            padding: 0.5rem 0.6rem;
            border-radius: 6px;
            transition: background 0.15s;
            border-left: 3px solid #667eea;
            margin-bottom: 0.3rem;
        }
        .book-item:hover { background: #f0f2ff; }

        .book-link {
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
        }

        .book-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: #222;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 1;
            min-width: 0;
        }

        .book-sep {
            color: #ccc;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .book-authors {
            font-size: 0.88rem;
            color: #667eea;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 2;
            min-width: 0;
        }

        .book-date {
            font-size: 0.82rem;
            color: #999;
            white-space: nowrap;
            flex-shrink: 0;
            margin-left: auto;
        }

        .no-files { text-align: center; padding: 3rem; color: #666; font-style: italic; }

        .count {
            text-align: center; color: #667eea;
            font-weight: bold; margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .loading { text-align: center; padding: 2rem; color: #667eea; }
        .error {
            background: #f8d7da; color: #721c24;
            padding: 1rem; border-radius: 5px;
            border-left: 4px solid #f5c6cb; margin: 1rem 0;
        }
        .spinner {
            border: 3px solid #f3f3f3; border-top: 3px solid #667eea;
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin: 2rem auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .search-box { margin-bottom: 1rem; }
        .search-input {
            width: 100%; padding: 0.8rem 1rem;
            border: 2px solid #e0e0e0; border-radius: 8px;
            font-size: 1rem; transition: border-color 0.3s;
        }
        .search-input:focus { outline: none; border-color: #667eea; }

        .book-desc {
            font-size: 0.82rem;
            color: #777;
            margin-top: 0.3rem;
            padding-left: 0;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .last-update {
            text-align: center; color: #999; font-size: 0.8rem;
            margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

<!-- ── Login ── -->
<div id="page-login" class="container" style="display:none">
    <div class="login-box">
        <h1>📚 disponible</h1>
        <p class="subtitle">Entrez votre email pour recevoir un lien de connexion</p>
        <div class="login-form">
            <input type="email" id="login-email" class="login-input" placeholder="votre@email.com" />
            <button id="login-btn" class="login-btn">Envoyer le lien</button>
            <div id="login-message" class="login-message"></div>
        </div>
    </div>
</div>

<!-- ── Bibliothèque ── -->
<div id="page-library" class="container" style="display:none">
    <div class="top-bar">
        <button class="logout-btn" id="logout-btn">Déconnexion</button>
    </div>
    <h1>📚 disponible</h1>
    <div class="search-box">
        <input type="text" id="search" class="search-input" placeholder="🔍 Rechercher">
    </div>
    <div id="content">
        <div class="loading"><div class="spinner"></div><p>Chargement ...</p></div>
    </div>
    <div id="last-update" class="last-update"></div>
</div>

<script>
    const AUTH_URL = 'https://auth.vivalink.top';
    const TOKEN_KEY = 'library_device_token';
    let allBooks = [];

    function getToken() { return localStorage.getItem(TOKEN_KEY); }
    function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
    function clearToken() { localStorage.removeItem(TOKEN_KEY); }

    function showPage(name) {
        document.getElementById('page-login').style.display = 'none';
        document.getElementById('page-library').style.display = 'none';
        document.getElementById('page-' + name).style.display = 'block';
    }

    async function checkToken() {
        const token = getToken();
        if (!token) return false;
        try {
            const resp = await fetch(AUTH_URL + '/auth/me', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            return resp.ok;
        } catch { return false; }
    }

    async function handleMagicLink() {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        if (!token) return false;
        try {
            const resp = await fetch(AUTH_URL + '/auth/login?token=' + encodeURIComponent(token));
            if (!resp.ok) return false;
            const data = await resp.json();
            if (data.device_token) {
                setToken(data.device_token);
                window.history.replaceState({}, '', window.location.pathname);
                return true;
            }
        } catch { return false; }
        return false;
    }

    async function requestMagicLink(email) {
        const btn = document.getElementById('login-btn');
        const msg = document.getElementById('login-message');
        btn.disabled = true;
        btn.textContent = 'Envoi en cours...';
        msg.className = 'login-message';
        msg.textContent = '';
        try {
            const resp = await fetch(AUTH_URL + '/auth/request-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            if (resp.ok) {
                msg.className = 'login-message success';
                msg.textContent = '✅ Lien envoyé ! Vérifiez votre boîte mail (et les spams).';
                document.getElementById('login-email').value = '';
            } else {
                msg.className = 'login-message error';
                msg.textContent = '❌ Erreur lors de l\'envoi. Réessayez.';
            }
        } catch {
            msg.className = 'login-message error';
            msg.textContent = '❌ Service indisponible. Réessayez plus tard.';
        } finally {
            btn.disabled = false;
            btn.textContent = 'Envoyer le lien';
        }
    }

    function displayBooks(books) {
        const content = document.getElementById('content');
        if (books.length === 0) {
            content.innerHTML = '<div class="no-files">Aucun livre ne correspond à votre recherche.</div>';
            return;
        }

        let html = `<div class="count">${books.length} livre(s)</div><ul class="book-list">`;

        books.forEach(file => {
            const meta = file.metadata || {};
            const authors = meta.authors && meta.authors.length > 0 ? meta.authors.join(', ') : '';
            const year = meta.date ? meta.date.split('-')[0] : '';

            html += `<li class="book-item">
                <a href="${file.path}" class="book-link" data-epub="${file.path}">
                    <span class="book-title">${file.displayName}</span>
                    ${authors ? `<span class="book-sep">—</span><span class="book-authors">${authors}</span>` : ''}
                    ${year ? `<span class="book-date">${year}</span>` : ''}
                </a>
                    ${meta.description ? `<div class="book-desc">${(meta.description || '').replace(/<[^>]*>/g, '').substring(0, 150)}…</div>` : ''}
            </li>`;
        });

        html += '</ul>';
        content.innerHTML = html;

        document.querySelectorAll('[data-epub]').forEach(link => {
            link.addEventListener('click', async (e) => {
                e.preventDefault();
                const url = link.getAttribute('data-epub');
                const token = getToken();
                try {
                    const resp = await fetch(url, {
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    if (resp.status === 401) { logout(); return; }
                    const blob = await resp.blob();
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = url.split('/').pop();
                    a.click();
                    URL.revokeObjectURL(a.href);
                } catch { alert('Erreur lors du téléchargement.'); }
            });
        });
    }

    function filterBooks(query) {
        if (!query.trim()) { displayBooks(allBooks); return; }
        const s = query.toLowerCase();
        displayBooks(allBooks.filter(book => {
            const m = book.metadata || {};
            return book.displayName.toLowerCase().includes(s)
                || (m.authors && m.authors.some(a => a.toLowerCase().includes(s)))
                || (m.description && m.description.toLowerCase().includes(s))
                || (m.publisher && m.publisher.toLowerCase().includes(s));
        }));
    }

    async function loadBooks() {
        const content = document.getElementById('content');
        const token = getToken();
        try {
            const resp = await fetch('/library/api/books', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (resp.status === 401) { clearToken(); showPage('login'); return; }
            const data = await resp.json();
            allBooks = data.files;
            displayBooks(allBooks);
        } catch (error) {
            content.innerHTML = `<div class="error">❌ Erreur de chargement : ${error.message}</div>`;
        }
    }

    async function logout() {
        const token = getToken();
        if (token) {
            try {
                await fetch(AUTH_URL + '/auth/logout', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
            } catch {}
        }
        clearToken();
        showPage('login');
    }

    async function init() {
        const loggedIn = await handleMagicLink();
        if (loggedIn || await checkToken()) {
            showPage('library');
            loadBooks();
        } else {
            clearToken();
            showPage('login');
        }
    }

    document.getElementById('login-btn').addEventListener('click', () => {
        const email = document.getElementById('login-email').value.trim();
        if (!email) return;
        requestMagicLink(email);
    });
    document.getElementById('login-email').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('login-btn').click();
    });
    document.getElementById('search').addEventListener('input', (e) => filterBooks(e.target.value));
    document.getElementById('logout-btn').addEventListener('click', logout);

    init();
</script>
</body>
</html>
