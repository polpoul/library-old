<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliothèque.api</title>
    <style>
        body {
            font-family: Georgia, serif;
            background: #f5f4f0;
            color: #1a1a2e;
            margin: 0;
            padding: 1rem;
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 1.2rem;
            color: #444;
            border-bottom: 1px solid #ddd;
            padding-bottom: 0.5rem;
        }
        ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        li {
            background: white;
            border: 1px solid #e8e6e0;
            border-radius: 8px;
            padding: 0.8rem 1rem;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
        }
        .info { flex: 1; min-width: 0; }
        .titre {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 0.2rem;
        }
        .auteur {
            font-size: 0.85rem;
            color: #666;
            font-style: italic;
        }
        .btn-dl {
            display: inline-block;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            padding: 0.4rem 0.7rem;
            font-size: 0.8rem;
            font-family: sans-serif;
            white-space: nowrap;
            flex-shrink: 0;
        }
        #msg {
            color: #888;
            font-style: italic;
        }
        #search {
            width: 100%;
            padding: 0.65rem 0.9rem;
            border: 2px solid #e8e6e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: Georgia, serif;
            background: white;
            box-sizing: border-box;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <h1>📚 Bibliothèque</h1>
    <p id="msg">Chargement…</p>
    <input type="search" id="search" placeholder="Rechercher un titre, un auteur…">
    <ul id="liste"></ul>
    <script>
        var API = 'https://library-api.vivalink.top';
        var msg = document.getElementById('msg');
        var allBooks = [];

        function showError(detail) {
            msg.style.color = '#c00';
            msg.style.fontStyle = 'normal';
            msg.style.fontSize = '0.85rem';
            msg.innerHTML = '<strong>Erreur de chargement</strong><br>' + detail;
            msg.style.display = '';
        }

        function renderBooks(books) {
            var liste = document.getElementById('liste');
            liste.innerHTML = '';
            books.forEach(function(b) {
                var li = document.createElement('li');
                var titre = b.metadata && b.metadata.title ? b.metadata.title : b.displayName;
                var auteurs = b.metadata && b.metadata.authors && b.metadata.authors.length > 0
                    ? b.metadata.authors.join(', ') : '';
                var dlUrl = API + '/ressources-public/' + encodeURIComponent(b.name);
                li.innerHTML = '<div class="info">' +
                    '<div class="titre">' + titre + '</div>' +
                    (auteurs ? '<div class="auteur">' + auteurs + '</div>' : '') +
                    '</div>' +
                    '<a class="btn-dl" href="' + dlUrl + '" download>Télécharger</a>';
                liste.appendChild(li);
            });
        }

        function filterBooks(q) {
            if (!q.trim()) { renderBooks(allBooks); return; }
            var s = q.toLowerCase();
            renderBooks(allBooks.filter(function(b) {
                var titre = b.metadata && b.metadata.title ? b.metadata.title : b.displayName;
                var auteurs = b.metadata && b.metadata.authors ? b.metadata.authors.join(' ') : '';
                return titre.toLowerCase().indexOf(s) !== -1 || auteurs.toLowerCase().indexOf(s) !== -1;
            }));
        }

        document.getElementById('search').addEventListener('input', function(e) {
            filterBooks(e.target.value);
        });

        fetch(API + '/api/books/public')
            .then(function(r) {
                if (!r.ok) {
                    showError('HTTP ' + r.status + ' sur ' + API + '/api/books/public');
                    return null;
                }
                return r.json();
            })
            .then(function(d) {
                if (!d) return;
                msg.style.display = 'none';
                if (!d.files || d.files.length === 0) {
                    msg.textContent = 'Aucun livre disponible.';
                    msg.style.display = '';
                    return;
                }
                allBooks = d.files;
                document.getElementById('search').style.display = 'block';
                renderBooks(allBooks);
            })
            .catch(function(e) {
                showError('fetch() a échoué : ' + e.message + '<br>URL : ' + API + '/api/books/public');
            });
    </script>
</body>
</html>
