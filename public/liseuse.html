<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliothèque</title>
    <style>
        body {
            font-family: Georgia, serif;
            background: #f5f4f0;
            color: #1a1a2e;
            margin: 0;
            padding: 1rem;
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 1.2rem;
            color: #444;
            border-bottom: 1px solid #ddd;
            padding-bottom: 0.5rem;
        }
        ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        li {
            background: white;
            border: 1px solid #e8e6e0;
            border-radius: 8px;
            padding: 0.8rem 1rem;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
        }
        .info { flex: 1; min-width: 0; }
        .titre {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 0.2rem;
        }
        .auteur {
            font-size: 0.85rem;
            color: #666;
            font-style: italic;
        }
        .btn-dl {
            display: inline-block;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            padding: 0.4rem 0.7rem;
            font-size: 0.8rem;
            font-family: sans-serif;
            white-space: nowrap;
            flex-shrink: 0;
        }
        #msg {
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>📚 Bibliothèque</h1>
    <p id="msg">Chargement…</p>
    <ul id="liste"></ul>
    <script>
        var API = 'https://library-api.vivalink.top';
        fetch(API + '/api/books/public')
            .then(function(r) { return r.json(); })
            .then(function(d) {
                document.getElementById('msg').style.display = 'none';
                var liste = document.getElementById('liste');
                if (!d.files || d.files.length === 0) {
                    document.getElementById('msg').textContent = 'Aucun livre disponible.';
                    document.getElementById('msg').style.display = '';
                    return;
                }
                d.files.forEach(function(b) {
                    var li = document.createElement('li');
                    var titre = b.metadata && b.metadata.title ? b.metadata.title : b.displayName;
                    var auteurs = b.metadata && b.metadata.authors && b.metadata.authors.length > 0
                        ? b.metadata.authors.join(', ') : '';
                    var dlUrl = API + '/ressources-public/' + encodeURIComponent(b.name);
                    li.innerHTML = '<div class="info">' +
                        '<div class="titre">' + titre + '</div>' +
                        (auteurs ? '<div class="auteur">' + auteurs + '</div>' : '') +
                        '</div>' +
                        '<a class="btn-dl" href="' + dlUrl + '" download>Télécharger</a>';
                    liste.appendChild(li);
                });
            })
            .catch(function() {
                document.getElementById('msg').textContent = 'Erreur de chargement.';
            });
    </script>
</body>
</html>
