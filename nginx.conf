server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Pas de cache sur books.json (mis à jour au redémarrage)
    location = /books.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Les EPUBs : cache long (les fichiers ne changent pas)
    location /ressources/ {
        add_header Cache-Control "public, max-age=86400";
        # Forcer le téléchargement (pas d'ouverture inline)
        add_header Content-Disposition 'attachment';
    }

    # Tout le reste : fichiers statiques
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    # Logs
    access_log /var/log/nginx/library.access.log;
    error_log  /var/log/nginx/library.error.log warn;
}
